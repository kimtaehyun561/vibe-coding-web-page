
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 목표와 자기소개</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f3f6fb;
      color: #202b3c;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 5px 20px #20305010;
    }

    h1, h2, p {
      margin-top: 0;
    }

    h1 {
      font-size: 28px;
      text-align: center;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 16px;
    }

    /* 수능 D-day */
    .dday {
      text-align: center;
      background: #e5efff;
    }

    .dday-number {
      font-size: 42px;
      font-weight: bold;
      color: #2463eb;
      margin: 12px 0;
    }

    .subtext {
      color: #637087;
      font-size: 14px;
    }

    /* 자기소개 카드 */
    .profile {
      text-align: center;
    }

    .emoji {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .profile p {
      color: #637087;
      line-height: 1.7;
    }

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }

    .tag {
      background: #edf2ff;
      color: #3157b7;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
    }

    .github {
      display: inline-block;
      padding: 11px 20px;
      background: #202b3c;
      color: white;
      text-decoration: none;
      border-radius: 12px;
    }

    /* 5×5 만다라트 */
    .goal-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .goal-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 115px;
      padding: 10px 5px;
      border: 1px solid #dce4ef;
      border-radius: 12px;
      background: #f9fbff;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      cursor: text;
      transition: border-color 0.2s, background 0.2s;
    }

    .goal-cell:focus {
      outline: 2px solid #6c95ff;
      border-color: #6c95ff;
      background: white;
    }

    .goal-cell.main-goal {
      background: #dce9ff;
      border: 2px solid #3978d4;
      color: #173e78;
      font-weight: bold;
      font-size: 16px;
    }

    .hint {
      margin: 12px 0 0;
      font-size: 13px;
      color: #758198;
      line-height: 1.6;
    }

    .reset-button {
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      background: #e8edf5;
      color: #26344a;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px 8px 28px;
      }

      .card {
        padding: 16px 10px;
        border-radius: 15px;
      }

      h1 {
        font-size: 23px;
      }

      .goal-grid {
        gap: 4px;
      }

      .goal-cell {
        min-height: 86px;
        padding: 5px 2px;
        font-size: 11px;
        border-radius: 8px;
      }

      .goal-cell.main-goal {
        font-size: 12px;
      }

      .dday-number {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- 수능 D-day -->
    <section class="card dday">
      <h1>📅 수능까지</h1>
      <div class="dday-number" id="dday">계산 중...</div>
      <p class="subtext">목표 날짜: 2027년 11월 18일</p>
    </section>

    <!-- 자기소개 카드 -->
    <section class="card profile">
      <div class="emoji">🔥</div>
      <h1>김태현</h1>
      <p>물리랑 코딩을 좋아하는 고등학교 1학년입니다</p>

      <div class="tags">
        <span class="tag">⚽ 축구</span>
        <span class="tag">🎵 음악</span>
        <span class="tag">⚛️ 물리학</span>
      </div>

      <a class="github"
         href="https://github.com/"
         target="_blank"
         rel="noopener noreferrer">
        내 깃허브 ↗
      </a>
    </section>

    <!-- 만다라트 목표판 -->
    <section class="card">
      <h1>🎯 나의 만다라트</h1>
      <p class="subtext" style="text-align:center">
        물리학과 진학을 위한 25가지 목표
      </p>

      <div class="goal-grid" id="goalGrid"></div>

      <p class="hint">
        💡 목표 칸을 클릭하면 바로 수정할 수 있어요.
        입력한 내용은 자동으로 저장됩니다.
      </p>

      <button class="reset-button" id="resetButton" type="button">
        처음 목표로 되돌리기
      </button>
    </section>

  </main>

  <script>
    // 수능 D-day 계산
    function updateDday() {
      const target = new Date(2027, 10, 18);
      const today = new Date();

      today.setHours(0, 0, 0, 0);

      const difference = target.getTime() - today.getTime();
      const days = Math.ceil(difference / (1000 * 60 * 60 * 24));

      const output = document.getElementById("dday");

      if (days > 0) {
        output.textContent = "D-" + days;
      } else if (days === 0) {
        output.textContent = "D-DAY";
      } else {
        output.textContent = "D+" + Math.abs(days);
      }
    }

    updateDday();

    // 기본 만다라트 목표 25개
    const defaultGoals = [
      "영어 단어 외우기",
      "수학 오답노트",
      "물리 개념 정리",
      "과학 독서",
      "과학 발표",

      "매일 영어 복습",
      "수학 문제 풀이",
      "과학 심화 탐구",
      "코딩 프로젝트",
      "파이썬 기초",

      "주 4회 운동",
      "8시간 수면",
      "물리학과 진학",
      "주간 계획 세우기",
      "스마트폰 시간 관리",

      "월 2권 독서",
      "시험 후 오답 분석",
      "물리 실험 기록",
      "학교 수업 복습",
      "꾸준한 공부 습관",

      "수능 기초 다지기",
      "모르는 것 질문하기",
      "탐구 보고서 작성",
      "공부 시간 기록",
      "매주 목표 점검"
    ];

    const STORAGE_KEY = "physics-mandalart-5x5";
    const goalGrid = document.getElementById("goalGrid");

    // 저장된 목표 불러오기
    function loadGoals() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          const parsed = JSON.parse(saved);

          if (
            Array.isArray(parsed) &&
            parsed.length === 25 &&
            parsed.every(item => typeof item === "string")
          ) {
            return parsed;
          }
        }
      } catch (error) {
        console.warn("저장된 목표를 불러오지 못했습니다.", error);
      }

      return [...defaultGoals];
    }

    let goals = loadGoals();

    // 목표를 브라우저에 저장
    function saveGoals() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
      } catch (error) {
        alert("저장할 수 없습니다. 브라우저의 저장 설정을 확인해 주세요.");
      }
    }

    // 25개 목표 칸 만들기
    function renderGoals() {
      goalGrid.replaceChildren();

      goals.forEach((goal, index) => {
        const cell = document.createElement("div");

        cell.className = "goal-cell";
        cell.contentEditable = "true";
        cell.setAttribute("role", "textbox");
        cell.setAttribute("aria-label", (index + 1) + "번째 목표");
        cell.setAttribute("spellcheck", "false");
        cell.textContent = goal;

        if (index === 12) {
          cell.classList.add("main-goal");
          cell.setAttribute("aria-label", "중심 목표: 물리학과 진학");
        }

        // 글자를 수정할 때마다 자동 저장
        cell.addEventListener("input", () => {
          goals[index] = cell.innerText;
          saveGoals();
        });

        goalGrid.appendChild(cell);
      });
    }

    renderGoals();

    // 기본 목표로 초기화
    document.getElementById("resetButton").addEventListener("click", () => {
      const confirmed = confirm(
        "수정한 목표를 모두 지우고 처음 목표로 되돌릴까요?"
      );

      if (!confirmed) return;

      goals = [...defaultGoals];
      saveGoals();
      renderGoals();
    });
  </script>
</body>
</html>
