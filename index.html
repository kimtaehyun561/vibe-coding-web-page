
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TH ARCADE | 나의 공간</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #f0f6ff;
      background:
        radial-gradient(ellipse at 15% 15%, #123c55 0%, transparent 40%),
        radial-gradient(ellipse at 85% 85%, #351653 0%, transparent 40%),
        linear-gradient(135deg, #070b18, #10152b 55%, #090d1c);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    .main-emoji {
      font-size: 62px;
      filter: drop-shadow(0 0 18px #43eaff);
      animation: float 3s ease-in-out infinite;
    }

    .brand {
      margin-top: 12px;
      color: #5eeaff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 5px;
      text-shadow: 0 0 12px #36dfff;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #65eaff, #a78bfa, #ff83d2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 15px #6178ff55);
    }

    .intro {
      margin: 0;
      color: #aab8d3;
      font-size: 15px;
      line-height: 1.8;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .menu-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 22px 30px;
      text-align: center;
      text-decoration: none;
      color: #f0f6ff;
      background: linear-gradient(145deg, #171f39, #10162b);
      border: 1px solid #354565;
      border-radius: 26px;
      box-shadow:
        0 12px 35px #0008,
        inset 0 0 20px #ffffff05;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      overflow: hidden;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      opacity: 0.8;
    }

    .goal-card::before {
      background: #50ffae;
      box-shadow: 0 0 18px #50ffae;
    }

    .games-card::before {
      background: #55dfff;
      box-shadow: 0 0 18px #55dfff;
    }

    .menu-card:hover {
      transform: translateY(-8px);
    }

    .goal-card:hover {
      border-color: #50ffae;
      box-shadow:
        0 0 12px #50ffae55,
        0 0 35px #50ffae33,
        0 18px 40px #0009;
    }

    .games-card:hover {
      border-color: #55dfff;
      box-shadow:
        0 0 12px #55dfff55,
        0 0 35px #55dfff33,
        0 18px 40px #0009;
    }

    .menu-card:focus-visible {
      outline: 3px solid #a78bfa;
      outline-offset: 5px;
    }

    .menu-icon {
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      border-radius: 30px;
      font-size: 58px;
    }

    .goal-icon {
      background: #123b32;
      border: 1px solid #50ffae88;
      box-shadow: 0 0 22px #50ffae33, inset 0 0 18px #50ffae22;
      text-shadow: 0 0 15px #50ffae;
    }

    .games-icon {
      background: #122f4a;
      border: 1px solid #55dfff88;
      box-shadow: 0 0 22px #55dfff33, inset 0 0 18px #55dfff22;
      text-shadow: 0 0 15px #55dfff;
    }

    .menu-card h2 {
      margin: 0 0 12px;
      font-size: 25px;
      color: #ffffff;
    }

    .goal-card h2 {
      text-shadow: 0 0 12px #50ffae77;
    }

    .games-card h2 {
      text-shadow: 0 0 12px #55dfff77;
    }

    .menu-card p {
      min-height: 52px;
      margin: 0;
      color: #aab8d3;
      font-size: 14px;
      line-height: 1.8;
    }

    .go-button {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 25px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }

    .goal-button {
      color: #061b13;
      background: #50ffae;
      box-shadow: 0 0 15px #50ffae77;
    }

    .games-button {
      color: #061622;
      background: #55dfff;
      box-shadow: 0 0 15px #55dfff77;
    }

    .menu-card:hover .go-button {
      transform: scale(1.06);
      filter: brightness(1.12);
    }

    footer {
      margin-top: 42px;
      text-align: center;
      color: #687b9e;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-9px);
      }
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 40px 16px;
      }

      header {
        margin-bottom: 30px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .menu-card {
        padding: 28px 18px 25px;
      }

      .menu-icon {
        width: 90px;
        height: 90px;
        font-size: 46px;
      }

      .menu-card p {
        min-height: 0;
      }

      footer {
        margin-top: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="main-emoji">🌌</div>

      <div class="brand">TH ARCADE</div>

      <h1>MY PLAYGROUND</h1>

      <p class="intro">
        나만의 목표를 만들고 새로운 게임에 도전해 보세요.<br>
        원하는 공간을 선택해 시작하세요!
      </p>
    </header>

    <section class="menu-grid">

      <!-- 만다라트 -->
      <a class="menu-card goal-card" href="./goal/index.html">

        <div class="menu-icon goal-icon">🎯</div>

        <h2>나의 만다라트</h2>

        <p>
          목표를 세우고 작은 실천 계획을<br>
          하나씩 완성해 보세요.
        </p>

        <span class="go-button goal-button">
          만다라트 바로가기 →
        </span>

      </a>

      <!-- 게임 -->
      <a class="menu-card games-card" href="./game/index.html">

        <div class="menu-icon games-icon">🎮</div>

        <h2>게임 놀이터</h2>

        <p>
          다양한 게임에 도전하고<br>
          나만의 최고 기록을 만들어 보세요.
        </p>

        <span class="go-button games-button">
          게임하러 가기 →
        </span>

      </a>

    </section>

    <footer>
      ✦ MY SPACE · CREATE YOUR OWN WORLD ✦
    </footer>

  </main>
</body>
</html>
