
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두더지 잡기 게임 🐹</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #17152f, #28245b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 430px;
      padding: 25px 18px;
      border-radius: 25px;
      background: #211f42;
      border: 1px solid #6259a8;
      box-shadow: 0 0 30px #7567ff35;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: #b8aaff;
    }

    .description {
      color: #c7c2e8;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 22px;
    }

    .stat {
      background: #302c59;
      border-radius: 15px;
      padding: 13px 5px;
    }

    .stat-label {
      color: #b8b0e9;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
      color: #ffffff;
    }

    #time {
      color: #ffca7a;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin: 0 auto 22px;
    }

    .hole {
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 50%;
      background: #121126;
      border: 3px solid #484174;
      box-shadow: inset 0 5px 12px #0008;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(35px, 11vw, 55px);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.1s;
    }

    .hole:active {
      transform: scale(0.92);
    }

    .hole.active {
      background: #41386e;
      border-color: #a99aff;
      box-shadow: 0 0 18px #9b83ff65;
    }

    .hole.hit {
      background: #315a54;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      background: linear-gradient(90deg, #8b70ff, #b16bff);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      min-height: 25px;
      margin-top: 16px;
      color: #d0c8ff;
      font-size: 14px;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #8982b9;
    }
  </style>
</head>

<body>

  <main class="game">

    <h1>🐹 두더지 잡기!</h1>
    <div class="description">
      나타나는 두더지를 빠르게 터치하세요!
    </div>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">현재 점수</div>
        <div class="stat-value" id="score">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">남은 시간</div>
        <div class="stat-value" id="time">30</div>
      </div>

      <div class="stat">
        <div class="stat-label">최고 기록</div>
        <div class="stat-value" id="best">0</div>
      </div>
    </section>

    <section class="board" id="board">
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
      <div class="hole"></div>
    </section>

    <button id="startBtn">게임 시작하기 🚀</button>

    <div class="message" id="message">
      시작 버튼을 눌러 게임을 시작하세요!
    </div>

    <div class="footer">
      제한 시간 30초 · 최고 기록은 자동 저장됩니다
    </div>

  </main>

  <script>
    // 게임에 필요한 요소
    const holes = document.querySelectorAll(".hole");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const bestText = document.getElementById("best");
    const startBtn = document.getElementById("startBtn");
    const message = document.getElementById("message");

    // 게임 변수
    let score = 0;
    let timeLeft = 30;
    let activeIndex = -1;
    let playing = false;
    let timer = null;
    let moleTimer = null;

    // 최고 기록 불러오기
    let bestScore = Number(
      localStorage.getItem("moleBestScore") || 0
    );

    bestText.textContent = bestScore;

    // 모든 구멍 초기화
    function clearHoles() {
      holes.forEach(hole => {
        hole.textContent = "";
        hole.classList.remove("active", "hit");
      });

      activeIndex = -1;
    }

    // 랜덤한 구멍에 두더지 등장
    function showMole() {
      if (!playing) return;

      clearHoles();

      const randomIndex = Math.floor(
        Math.random() * holes.length
      );

      activeIndex = randomIndex;

      holes[randomIndex].textContent = "🐹";
      holes[randomIndex].classList.add("active");
    }

    // 두더지 터치
    holes.forEach((hole, index) => {
      hole.addEventListener("pointerdown", () => {

        if (!playing) return;
        if (index !== activeIndex) return;

        score++;

        scoreText.textContent = score;

        hole.textContent = "✨";
        hole.classList.remove("active");
        hole.classList.add("hit");

        activeIndex = -1;
      });
    });

    // 게임 종료
    function endGame() {
      playing = false;

      clearInterval(timer);
      clearInterval(moleTimer);

      clearHoles();

      if (score > bestScore) {
        bestScore = score;

        localStorage.setItem(
          "moleBestScore",
          bestScore
        );

        bestText.textContent = bestScore;

        message.textContent =
          "🏆 신기록 달성! 정말 잘했어요!";
      } else {
        message.textContent =
          "🎮 게임 종료! 최종 점수: " + score + "점";
      }

      startBtn.textContent = "다시 도전하기 🔄";
    }

    // 게임 시작
    function startGame() {

      clearInterval(timer);
      clearInterval(moleTimer);

      score = 0;
      timeLeft = 30;
      playing = true;

      scoreText.textContent = score;
      timeText.textContent = timeLeft;

      message.textContent = "두더지를 잡아보세요! 🔥";
      startBtn.textContent = "게임 진행 중...";

      showMole();

      // 0.7초마다 새로운 두더지 등장
      moleTimer = setInterval(showMole, 700);

      // 1초마다 시간 감소
      timer = setInterval(() => {

        timeLeft--;

        timeText.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }

      }, 1000);
    }

    // 시작 버튼
    startBtn.addEventListener("click", () => {
      if (!playing) {
        startGame();
      }
    });

  </script>

</body>
</html>
