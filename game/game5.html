
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운석 피하기 🚀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b1c;
      font-family: Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .top-info {
      position: fixed;
      top: max(15px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 22px;
      pointer-events: none;
      z-index: 2;
    }

    .info-box {
      padding: 10px 16px;
      border-radius: 14px;
      background: #171d38cc;
      border: 1px solid #6673ad66;
      color: white;
      text-align: center;
      min-width: 100px;
      backdrop-filter: blur(8px);
    }

    .info-label {
      font-size: 11px;
      color: #aab7e8;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
    }

    .hint {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 0;
      width: 100%;
      text-align: center;
      color: #aab7e8;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <canvas id="gameCanvas"></canvas>

  <div class="top-info">
    <div class="info-box">
      <div class="info-label">생존 시간</div>
      <div class="info-value" id="score">0.0초</div>
    </div>

    <div class="info-box">
      <div class="info-label">최고 기록</div>
      <div class="info-value" id="best">0.0초</div>
    </div>
  </div>

  <div class="hint" id="hint">
    손가락으로 우주선을 움직이세요
  </div>

  <script>
    // =================================
    // 1. 기본 설정
    // =================================

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const bestText = document.getElementById("best");
    const hint = document.getElementById("hint");

    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = 1;

    let gameState = "ready";

    let score = 0;
    let bestScore = Number(
      localStorage.getItem("meteorBest") || 0
    );

    let lastTime = 0;
    let elapsed = 0;
    let spawnTimer = 0;
    let meteors = [];
    let stars = [];

    // 우주선
    const player = {
      x: W / 2,
      y: H - 100,
      width: 42,
      height: 55,
      targetX: W / 2
    };

    bestText.textContent = bestScore.toFixed(1) + "초";


    // =================================
    // 2. 화면 크기 설정
    // =================================

    function resizeCanvas() {
      W = window.innerWidth;
      H = window.innerHeight;

      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = W * dpr;
      canvas.height = H * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      player.y = H - Math.max(90, H * 0.13);

      player.x = Math.max(
        25,
        Math.min(W - 25, player.x)
      );

      player.targetX = player.x;

      // 별 생성
      stars = [];

      for (let i = 0; i < 90; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          size: Math.random() * 2 + 0.5,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 30 + 10
        });
      }
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();


    // =================================
    // 3. 배경 그리기
    // =================================

    function drawBackground(dt) {
      ctx.fillStyle = "#080b1c";
      ctx.fillRect(0, 0, W, H);

      // 별 움직이기
      stars.forEach(star => {
        if (gameState === "playing") {
          star.y += star.speed * dt;

          if (star.y > H) {
            star.y = 0;
            star.x = Math.random() * W;
          }
        }

        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#ffffff";

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalAlpha = 1;
    }


    // =================================
    // 4. 우주선 그리기
    // =================================

    function drawPlayer() {
      ctx.save();

      ctx.translate(player.x, player.y);

      // 엔진 불꽃
      ctx.fillStyle = "#ff9d43";

      ctx.beginPath();
      ctx.moveTo(-9, 17);
      ctx.lineTo(0, 39 + Math.random() * 8);
      ctx.lineTo(9, 17);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff18a";

      ctx.beginPath();
      ctx.moveTo(-4, 18);
      ctx.lineTo(0, 31 + Math.random() * 5);
      ctx.lineTo(4, 18);
      ctx.closePath();
      ctx.fill();

      // 우주선 몸체
      ctx.fillStyle = "#a6d9ff";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(21, 19);
      ctx.lineTo(0, 11);
      ctx.lineTo(-21, 19);
      ctx.closePath();

      ctx.fill();
      ctx.stroke();

      // 조종석
      ctx.fillStyle = "#526dff";

      ctx.beginPath();
      ctx.ellipse(0, -7, 7, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // 날개 장식
      ctx.fillStyle = "#ff668a";

      ctx.fillRect(-20, 11, 7, 10);
      ctx.fillRect(13, 11, 7, 10);

      ctx.restore();
    }


    // =================================
    // 5. 운석 생성
    // =================================

    function createMeteor() {
      const radius = Math.random() * 15 + 13;

      const difficulty = Math.min(elapsed / 60, 2);

      meteors.push({
        x: Math.random() * (W - radius * 2) + radius,
        y: -radius - 10,
        radius: radius,

        speed: (180 + Math.random() * 100)
               * (1 + difficulty * 0.7),

        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 3,

        shape: Array.from(
          { length: 9 },
          () => 0.75 + Math.random() * 0.3
        )
      });
    }


    // =================================
    // 6. 운석 그리기
    // =================================

    function drawMeteor(meteor) {
      ctx.save();

      ctx.translate(meteor.x, meteor.y);
      ctx.rotate(meteor.rotation);

      // 운석 그림자
      ctx.shadowColor = "#ff713c";
      ctx.shadowBlur = 12;

      // 운석 모양
      ctx.fillStyle = "#a65b45";
      ctx.strokeStyle = "#e68b61";
      ctx.lineWidth = 2;

      ctx.beginPath();

      for (let i = 0; i < meteor.shape.length; i++) {
        const angle =
          (Math.PI * 2 / meteor.shape.length) * i;

        const r = meteor.radius * meteor.shape[i];

        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;

      // 운석 표면 무늬
      ctx.fillStyle = "#784436";

      ctx.beginPath();
      ctx.arc(-5, -4, meteor.radius * 0.23, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(7, 6, meteor.radius * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }


    // =================================
    // 7. 충돌 검사
    // =================================

    function checkCollision(meteor) {
      const dx = meteor.x - player.x;
      const dy = meteor.y - player.y;

      const distance = Math.sqrt(dx * dx + dy * dy);

      return distance < meteor.radius + 17;
    }


    // =================================
    // 8. 게임 업데이트
    // =================================

    function update(dt) {
      if (gameState !== "playing") return;

      elapsed += dt;
      score = elapsed;

      scoreText.textContent = score.toFixed(1) + "초";

      // 우주선 부드럽게 이동
      player.x += (player.targetX - player.x)
                  * Math.min(1, dt * 15);

      player.x = Math.max(
        25,
        Math.min(W - 25, player.x)
      );

      // 시간이 지날수록 운석 생성 간격 감소
      const spawnInterval = Math.max(
        0.22,
        0.9 - elapsed * 0.009
      );

      spawnTimer += dt;

      while (spawnTimer >= spawnInterval) {
        spawnTimer -= spawnInterval;
        createMeteor();
      }

      // 운석 이동
      for (let i = meteors.length - 1; i >= 0; i--) {
        const meteor = meteors[i];

        meteor.y += meteor.speed * dt;
        meteor.rotation += meteor.rotationSpeed * dt;

        // 충돌 검사
        if (checkCollision(meteor)) {
          endGame();
          return;
        }

        // 화면 아래로 나간 운석 삭제
        if (meteor.y > H + meteor.radius) {
          meteors.splice(i, 1);
        }
      }
    }


    // =================================
    // 9. 게임 화면 그리기
    // =================================

    function draw() {
      meteors.forEach(drawMeteor);

      if (gameState !== "over") {
        drawPlayer();
      }
    }


    // =================================
    // 10. 시작 화면
    // =================================

    function drawOverlay(title, subtitle, extra) {
      ctx.fillStyle = "#080b1caa";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 34px Arial";
      ctx.fillText(title, W / 2, H / 2 - 65);

      ctx.fillStyle = "#b9c9ff";
      ctx.font = "16px Arial";
      ctx.fillText(subtitle, W / 2, H / 2 - 15);

      ctx.fillStyle = "#8c80ff";
      ctx.font = "bold 18px Arial";
      ctx.fillText(extra, W / 2, H / 2 + 55);
    }


    // =================================
    // 11. 게임 종료
    // =================================

    function endGame() {
      gameState = "over";

      if (score > bestScore) {
        bestScore = score;

        localStorage.setItem(
          "meteorBest",
          bestScore
        );

        bestText.textContent =
          bestScore.toFixed(1) + "초";
      }

      hint.textContent = "화면을 터치하면 다시 시작합니다";
    }


    // =================================
    // 12. 게임 초기화
    // =================================

    function startGame() {
      score = 0;
      elapsed = 0;
      spawnTimer = 0;

      meteors = [];

      player.x = W / 2;
      player.targetX = W / 2;

      scoreText.textContent = "0.0초";

      gameState = "playing";

      hint.textContent =
        "손가락을 좌우로 움직여 운석을 피하세요!";
    }


    // =================================
    // 13. 터치 조작
    // =================================

    let pointerDown = false;

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();

      if (gameState === "ready" || gameState === "over") {
        startGame();
      }

      pointerDown = true;

      player.targetX = event.clientX;
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!pointerDown || gameState !== "playing") return;

      event.preventDefault();

      player.targetX = event.clientX;
    });

    canvas.addEventListener("pointerup", () => {
      pointerDown = false;
    });

    canvas.addEventListener("pointercancel", () => {
      pointerDown = false;
    });


    // =================================
    // 14. PC 방향키 조작
    // =================================

    const keys = {};

    window.addEventListener("keydown", (event) => {
      if (
        ["ArrowLeft", "ArrowRight", " "].includes(event.key)
      ) {
        event.preventDefault();
      }

      keys[event.key] = true;

      if (
        (event.key === " " || event.key === "Enter") &&
        (gameState === "ready" || gameState === "over")
      ) {
        startGame();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys[event.key] = false;
    });

    function updateKeyboard(dt) {
      if (gameState !== "playing") return;

      const speed = 380;

      if (keys["ArrowLeft"]) {
        player.targetX -= speed * dt;
      }

      if (keys["ArrowRight"]) {
        player.targetX += speed * dt;
      }

      player.targetX = Math.max(
        25,
        Math.min(W - 25, player.targetX)
      );
    }


    // =================================
    // 15. 메인 게임 루프
    // =================================

    function gameLoop(timestamp) {
      const dt = Math.min(
        (timestamp - lastTime) / 1000 || 0,
        0.05
      );

      lastTime = timestamp;

      drawBackground(dt);

      if (gameState === "playing") {
        updateKeyboard(dt);
        update(dt);
      }

      draw();

      if (gameState === "ready") {
        drawOverlay(
          "🚀 METEOR DODGE",
          "떨어지는 운석을 피해 살아남으세요!",
          "화면을 터치해서 시작"
        );
      }

      if (gameState === "over") {
        drawOverlay(
          "GAME OVER",
          "생존 시간: " + score.toFixed(1) + "초",
          "화면을 터치해서 재도전"
        );
      }

      requestAnimationFrame(gameLoop);
    }

    // 게임 실행
    requestAnimationFrame(gameLoop);

  </script>

</body>
</html>
